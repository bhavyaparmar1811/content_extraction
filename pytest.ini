[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    llm: calls the configured LLM provider; skipped unless SOP_RUN_LLM_TESTS=1
    word: opens files in Microsoft Word via COM; skipped unless SOP_RUN_WORD_TESTS=1 (Windows with Word)
